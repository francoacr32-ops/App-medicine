<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finlay · Estudio médico</title>
  <meta name="description" content="Estudia Medicina con tus libros y conferencias, con la fuente citada.">
  <meta name="theme-color" content="#dff0ee">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="iconos/icono-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Finlay">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="estilos.css">
  <script>
    // Tema y tamaño de letra elegidos en Perfil (antes de pintar, para que no parpadee)
    try {
      // Apariencia: "hora" (por defecto) = clara de 7 am a 7 pm y oscura de noche
      var t = localStorage.getItem("finlay.tema") || "hora", h = new Date().getHours();
      if (t === "hora") t = h >= 19 || h < 7 ? "oscuro" : "claro";
      else if (t === "telefono") t = matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
      document.documentElement.dataset.tema = t;
      if (window.FinlayAndroid) document.documentElement.classList.add("app-completa");
      var e = localStorage.getItem("finlay.escala"); if (e) document.documentElement.style.setProperty("--escala", e);
    } catch (x) {}
  </script>
</head>
<body>
  <header id="cabecera" class="barra">
    <button id="atras" class="atras" aria-label="Atrás" hidden></button>
    <h1 id="titulo">Finlay</h1>
  </header>
  <main id="app"></main>
  <div id="arranque" class="arranque" aria-label="Abriendo Finlay">
    <div class="arranque-centro">
      <img class="arranque-logo" src="iconos/cruz.webp" alt="">
      <h1 class="arranque-nombre">Finlay</h1>
      <p class="arranque-lema">Estudio médico</p>
      <svg class="arranque-ecg" viewBox="0 0 200 40" aria-hidden="true"><path d="M0 20 H70 L80 20 L86 6 L94 34 L102 2 L110 30 L116 20 H200"/></svg>
      <p class="arranque-texto">Preparando tu estudio…</p>
    </div>
  </div>

  <nav id="nav" class="nav-inferior" aria-label="Secciones"></nav>

  <div id="menu" class="menu-fondo" data-accion="cerrar-menu" hidden>
    <aside class="menu-panel" role="dialog" aria-label="Menú"></aside>
  </div>

  <input id="archivo" type="file" multiple hidden>
  <input id="paquete" type="file" hidden>
  <div id="progreso" class="progreso" role="status" aria-live="polite" hidden>
    <div class="progreso-caja">
      <img class="progreso-doctor" src="iconos/doctor/lee.webp" alt="">
      <h3 class="progreso-titulo">Un momento…</h3>
      <div class="progreso-barra"><span></span></div>
      <p class="progreso-pct"></p>
      <p class="progreso-detalle"></p>
    </div>
  </div>
  <div id="visor" class="visor" role="dialog" aria-label="Dónde está la respuesta" hidden>
    <div class="visor-caja">
      <header class="visor-barra">
        <span>📖 Dónde está la respuesta</span>
        <button class="atras" data-accion="cerrar-visor" aria-label="Cerrar">✕</button>
      </header>
      <div id="visor-cuerpo"></div>
      <button class="btn ancho" data-accion="cerrar-visor">Volver a la pregunta</button>
    </div>
  </div>
  <div id="lupa" class="lupa" hidden>
    <div class="lupa-barra"><span class="lupa-ayuda">Pellizca con dos dedos o toca dos veces para ampliar</span>
      <button class="btn" data-accion="cerrar-lupa">✕ Cerrar</button></div>
    <div class="lupa-caja"><img alt="Imagen ampliada" draggable="false"></div>
  </div>
  <div id="aviso" class="aviso" role="status" hidden></div>
  <button id="detener-voz" class="detener-voz" hidden>⏹ Detener voz</button>

  <noscript>Finlay necesita JavaScript activado.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
